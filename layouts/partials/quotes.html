<section class="quotes" aria-label="Reviews">
  {{ with site.Data.quotes }}
    {{ range . }}
      <blockquote>
        <p>&ldquo;{{ .quote | markdownify }}&rdquo;</p>
        <footer>— {{ if .url }}<a href="{{ .url }}" rel="noopener">{{ .source | markdownify }}</a>{{ else }}{{ .source | markdownify }}{{ end }}</footer>
      </blockquote>
    {{ end }}
  {{ end }}
</section>
